name: WakaTime Dev Metrics
on:
  # 每天凌晨自动运行（一天一次）
  schedule:
    - cron: '0 0 * * *'
  # 手动触发开关
  workflow_dispatch:
jobs:
  update-readme-stats:
    runs-on: ubuntu-latest
    # 🌟 新增：设置时区环境变量为北京时间
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run WakaTime Stats Action
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SECTION_NAME: waka
          # 🔒 隐私保护：关掉项目名称和时间轨迹
          SHOW_PROJECTS: false          # 隐藏具体项目名
          SHOW_TIMEZONE: false          # 隐藏时区（Asia/Shanghai）
          SHOW_DAYS_OF_WEEK: false      # 隐藏星期几活跃统计
          SHOW_OS: false                # 隐藏操作系统（可选，想更保密就关掉）
          SHOW_EDITORS: true            # 显示编辑器（比如 IntelliJ）通常没关系
          # 🚀 战果展示：开启代码行数统计
          SHOW_LINES_OF_CODE: true      # 重点！开启这个显示总行数
          SHOW_LOC_CHART: true          # 开启行数增长图表，看起来超帅！
          SHOW_COMMIT: true
          SHOW_LANGUAGE: true
          SHOW_LANGUAGE_PER_REPO: false # 建议关闭，防止通过仓库关联出项目信息
          SHOW_PROFILE_VIEWS: false
          SHOW_SHORT_INFO: false
          SHOW_UPDATED_DATE: true
          SHOW_TOTAL_CODE_TIME: true
          COMMIT_BY_ME: false
          COMMIT_MESSAGE: "Updated with Dev Metrics 🎮"
          COMMIT_SINGLE: false
          LOCALE: zh
          UPDATED_DATE_FORMAT: '%Y/%m/%d %H:%M:%S (GMT+8)'
          SYMBOL_VERSION: 1